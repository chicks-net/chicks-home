# Codecov

# Uploads coverage reports to codecov.io using OIDC authentication via the
# Codecov GitHub App (installed for this repo, so no upload token is needed).
# Coverage is a work in progress, so statuses are informational; see
# .codecov.yml.  https://docs.codecov.com/docs/github-actions

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:

# cancel superseded runs of this workflow on the same ref (rapid PR
# pushes don't queue up stale coverage jobs)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# global permissions
permissions: {}

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # OIDC token for codecov uploads (use_oidc below)
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Go files in bin/ are standalone scripts (no go.mod), so the
      # test files are passed explicitly rather than as a package path.
      - name: Go coverage
        run: |
          go test -coverprofile=go-coverage.out bin/hello.go bin/hello_test.go
          # go records absolute paths; codecov maps repo-relative ones
          sed -i "s|$PWD/||" go-coverage.out

      # shell: bash so pipefail applies: a truncated download must fail
      # here instead of exiting 0 on empty stdin and confusing the next
      # step with "Can't locate Devel/Cover".  cpanm fetches dists from
      # cpan.org and verifies their CHECKSUMS; the sudo that apt would
      # need is forbidden by the repo's compliance check.
      - name: Install Devel::Cover
        shell: bash
        run: |
          curl -L --fail https://cpanmin.us | perl - --local-lib "$HOME/perl5" --notest Devel::Cover Devel::Cover::Report::Cobertura
          echo "$HOME/perl5/bin" >> "$GITHUB_PATH"
          echo "PERL5LIB=$HOME/perl5/lib/perl5" >> "$GITHUB_ENV"

      # The Cobertura reporter emits everything in the coverage db, so
      # system paths (prove) and the test files themselves are filtered
      # out at collection time rather than at report time.
      - name: Perl coverage
        run: |
          PERL5OPT='-MDevel::Cover=-ignore,/usr/,-ignore,^t/' prove t/
          cover -silent -report cobertura

      # fork PRs don't get id-token: write, so uploads would fail; tests
      # still run above, the codecov statuses just don't apply there
      - name: Upload Go coverage to Codecov
        if: github.event.pull_request.head.repo.fork != true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: go-coverage.out
          flags: go
          disable_search: true
          fail_ci_if_error: true

      - name: Upload Perl coverage to Codecov
        if: github.event.pull_request.head.repo.fork != true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: cover_db/cobertura.xml
          flags: perl
          disable_search: true
          fail_ci_if_error: true
