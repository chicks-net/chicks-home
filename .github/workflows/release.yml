name: Release

# Triggered by tag pushes from `just release` (gh release create pushes the tag,
# which fires this workflow). The workflow attaches signed assets to the
# already-created release via `gh release upload`, so `just release` itself
# requires no changes. There is a brief ~60-90s window where the release exists
# with no assets while signing runs - acceptable for a dotfiles repo.
on:
  push:
    tags:
      - 'v*'

# Empty global permissions - each job declares what it needs.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # gh release upload
      id-token: write    # cosign keyless OIDC
      attestations: write # GitHub artifact attestations
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build asset bundle
        id: bundle
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          BUNDLE="chicks-home-${TAG}.tar.gz"
          # Distributable content: the dotfiles + bin/ that a consumer would
          # actually cherry-pick. Excludes .ssh/, .signature (trailing email
          # sig, not content), .DS_Store, and the .git/ working state.
          tar -czf "${BUNDLE}" \
            --exclude='.ssh' \
            --exclude='.signature' \
            --exclude='.DS_Store' \
            --exclude='.git' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='.git-prompt.sh' \
            bin \
            .just \
            .functions \
            .aliases \
            .bashrc \
            .bash_profile \
            .bash_logout \
            .bcrc \
            .gitconfig \
            .gitignore_global \
            .vimrc \
            .tmux.conf \
            .editorconfig \
            .perltidyrc \
            .pylintrc \
            .markdownlint.yml \
            .aliae.yaml \
            .repo.toml \
            Brewfile \
            justfile \
            README.md \
            LICENSE \
            AGENTS.md \
            CLAUDE.md
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "bundle=${BUNDLE}" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        env:
          BUNDLE: ${{ steps.bundle.outputs.bundle }}
        run: |
          set -euo pipefail
          sha256sum "${BUNDLE}" > checksums.txt
          cat checksums.txt

      - name: Generate subject hashes for SLSA provenance
        id: hash
        env:
          BUNDLE: ${{ steps.bundle.outputs.bundle }}
        run: |
          set -euo pipefail
          # SLSA generator expects base64-encoded sha256sum lines.
          hashes=$(sha256sum "${BUNDLE}" checksums.txt | base64 -w0)
          echo "hashes=$hashes" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: ${{ steps.bundle.outputs.bundle }}
          format: json
          output-file: ${{ steps.bundle.outputs.bundle }}.sbom.json

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign asset bundle with cosign (keyless)
        env:
          BUNDLE: ${{ steps.bundle.outputs.bundle }}
        run: |
          set -euo pipefail
          # Keyless signing via GitHub OIDC - no long-lived secrets to rotate.
          # The --bundle file embeds the signature, certificate, and Rekor
          # entry; verify downstream with the identity/issuer flags, e.g.:
          #   cosign verify-blob \
          #     --bundle chicks-home-${TAG}.tar.gz.bundle \
          #     --certificate-identity-regexp \
          #       "https://github.com/chicks-net/chicks-home/.github/workflows/release.yml@refs/tags/${TAG}" \
          #     --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
          #     chicks-home-${TAG}.tar.gz
          cosign sign-blob --yes "${BUNDLE}" \
            --bundle "${BUNDLE}.bundle"

      - name: Upload signed assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bundle.outputs.tag }}
          BUNDLE: ${{ steps.bundle.outputs.bundle }}
        run: |
          set -euo pipefail
          gh release upload "${TAG}" \
            "${BUNDLE}" \
            checksums.txt \
            "${BUNDLE}.bundle" \
            "${BUNDLE}.sbom.json" \
            --clobber

  provenance:
    needs: release
    permissions:
      actions: read
      id-token: write
      contents: write
    # SLSA generator requires a tag ref (refs/tags/vX.Y.Z) for its internal
    # builder checkout; pinning to a git SHA causes "Invalid ref" errors and
    # provenance generation failure.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses]
    with:
      base64-subjects: "${{ needs.release.outputs.hashes }}"
      upload-assets: true
